name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar dependências da documentação
        run: python -m pip install -r requirements-docs.txt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validar projetos
        run: python scripts/validate_projects.py

      - name: Construir site MkDocs
        run: python -m mkdocs build --strict --config-file mkdocs.yml

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ../site-local/linkedin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
