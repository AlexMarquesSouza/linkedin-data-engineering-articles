site_name: LinkedIn — Notícias técnicas com implementação
site_description: Artigos de Engenharia de Dados acompanhados de código local e testes
use_directory_urls: false
docs_dir: .
site_dir: ../site-local/linkedin
theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    primary: blue
    accent: light blue
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
exclude_docs: |
  **/__pycache__/**
  **/data/**
  **/src/**
  **/tests/**
  scripts/**
  mkdocs.yml
nav:
  - Início: README.md
  - Padrão didático: docs/PADRAO-DIDATICO.md
  - Publicar o site: docs/PUBLICAR-SITE.md
